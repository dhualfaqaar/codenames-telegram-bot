name = "codenames-telegram-bot"
main = "worker/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# وصلة الاستقبال + مؤقت يفحصها كل 5 دقائق (يرجّعها تلقائياً لو مسحت)
[vars]
WEBHOOK_URL = "https://codenames-telegram-bot.codenames-dhualfaqaar.workers.dev"

# Cloudflare Builds runs `wrangler preview` for non-production branches.
# Previews must not reuse the production webhook or Durable Object storage.
[previews.vars]
ENVIRONMENT = "preview"
WEBHOOK_URL = "https://example.invalid/preview"

[[previews.durable_objects.bindings]]
name = "BOT_STATE"
class_name = "BotState"

[triggers]
crons = ["*/5 * * * *"]

[durable_objects]
bindings = [
  { name = "BOT_STATE", class_name = "BotState" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotState"]
