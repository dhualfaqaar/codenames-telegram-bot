name = "codenames-telegram-bot"
main = "worker/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# وصلة الاستقبال + مؤقت يفحصها كل 5 دقائق (يرجّعها تلقائياً لو مسحت)
[vars]
WEBHOOK_URL = "https://codenames-telegram-bot.codenames-dhualfaqaar.workers.dev"

# Worker Preview builds must never register or replace the production Telegram webhook.
[previews.vars]
WEBHOOK_URL = "https://preview-codenames-telegram-bot.invalid"
PREVIEW_MODE = "true"

[triggers]
crons = ["*/5 * * * *"]

[durable_objects]
bindings = [
  { name = "BOT_STATE", class_name = "BotState" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotState"]
